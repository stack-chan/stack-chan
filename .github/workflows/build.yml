name: Diagnose PR 821 XS build debug controls
run-name: Diagnose PR 821 XS build debug controls

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware:
    name: ${{ matrix.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: "Standard host (#776, debug)"
            ref: 72d3340f858f47872eb6e6f038120006cf8d019f
            manifest: manifest_m5stackchan_cores3.json
            mode: debug
            wake: false
          - label: "Wakeword control (#814, debug)"
            ref: 964d4b49fdd7ee4aad13b8dc698fb964ff85dc4e
            manifest: manifest_m5stackchan_cores3_wakeword.json
            mode: debug
            wake: true
          - label: "Standard host (#821, debug)"
            ref: bb4660bbf3b54eed6db2a56bd03251745ad06a9c
            manifest: manifest_m5stackchan_cores3.json
            mode: debug
            wake: false

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - name: Set up the pinned firmware toolchain
        uses: ./.github/actions/setup
        with:
          target-branch: "10.1.1"
      - name: Prepare pinned WebRTC sources
        working-directory: firmware
        run: npm run setup:webrtc
      - name: Verify and package the official WakeNet model
        if: matrix.wake
        working-directory: firmware
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --location --retry 3 \
            'https://components.espressif.com/api/downloads/?object_type=component&object_id=dd49ba92-a9e8-4b05-a69e-9cdb787fd256' \
            --output "$RUNNER_TEMP/esp-sr.zip"
          unzip -q "$RUNNER_TEMP/esp-sr.zip" -d "$RUNNER_TEMP/esp-sr"
          suffix='/model/wakenet_model/wn9l_histackchan_tts3/wn9_index'
          index="$(find "$RUNNER_TEMP/esp-sr" -type f -path "*$suffix" -print -quit)"
          test -n "$index"
          node scripts/package-wakeword-model.mjs "${index%"$suffix"}"
      - name: Build the CoreS3 host
        working-directory: firmware
        env:
          BUILD_MODE: ${{ matrix.mode }}
          BUILD_MANIFEST: ${{ matrix.manifest }}
        run: |
          set -eo pipefail
          source "$HOME/.local/share/xs-dev-export.sh"
          git rev-parse HEAD
          npm run build -- m5stackchan_cores3 --mode="$BUILD_MODE" --manifest "host/app/$BUILD_MANIFEST"
      - name: Build the OpenAI Live WebRTC MOD with its default config
        working-directory: firmware
        env:
          BUILD_MODE: ${{ matrix.mode }}
        run: |
          set -eo pipefail
          source "$HOME/.local/share/xs-dev-export.sh"
          npm run mod:build -- --mode="$BUILD_MODE" mods/examples/openai_live_webrtc/manifest.json
