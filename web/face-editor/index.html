<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>顔エディタ | ｽﾀｯｸﾁｬﾝ</title>
    <link rel="icon" href="../assets/stackchan-favicon-32.png" type="image/png" />
    <link rel="apple-touch-icon" href="../assets/stackchan-apple-touch-icon.png" />
    <link rel="stylesheet" href="../global.css" />
    <link rel="stylesheet" href="./face-editor.css" />
    <script
      src="https://unpkg.com/lucide@1.24.0/dist/umd/lucide.min.js"
      integrity="sha384-mooE85Luwgx+AyykX7e90VcN8/QCFTSIwPuHLmvcsLVoA0en7lKYb9XlOzn5G2co"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <main class="face-editor-shell">
      <header class="topbar">
        <a class="brand-link" href="../"
          ><img src="../assets/stackchan-symbol.png" alt="" /><span>ｽﾀｯｸﾁｬﾝ 顔エディタ</span></a
        >
        <nav class="tool-nav" aria-label="ツール">
          <a href="../" title="ホーム" aria-label="ホーム"><i data-lucide="home"></i></a>
          <a href="../editor/" title="ブロックエディタ" aria-label="ブロックエディタ"><i data-lucide="blocks"></i></a>
          <a href="./" aria-current="page" title="顔エディタ" aria-label="顔エディタ"><i data-lucide="smile"></i></a>
        </nav>
      </header>
      <section class="face-editor-layout">
        <div class="face-preview" aria-label="顔アセットのプレビュー">
          <div id="face-canvas" class="face-canvas">
            <span class="eye left"></span><span class="eye right"></span><span id="mouth" class="mouth"></span>
          </div>
        </div>
        <form id="face-form" class="face-controls">
          <h1>顔アセット</h1>
          <label>名前<input id="face-name" value="マイフェイス" maxlength="64" /></label>
          <label
            >表情
            <select id="face-emotion">
              <option value="NEUTRAL">ふつう</option>
              <option value="HAPPY">うれしい</option>
              <option value="ANGRY">おこった</option>
              <option value="SAD">かなしい</option>
              <option value="SLEEPY">ねむい</option>
              <option value="DOUBTFUL">こまった</option>
              <option value="COLD">さむい</option>
              <option value="HOT">あつい</option>
            </select>
          </label>
          <label>線の色<input id="primary-color" type="color" value="#ffffff" /></label>
          <label>背景色<input id="secondary-color" type="color" value="#202020" /></label>
          <label>口の開き<input id="mouth-open" type="range" min="0" max="1" step="0.1" value="0.2" /></label>
          <div class="face-actions">
            <button id="download-face" type="button">JSONを保存</button>
            <button id="send-to-editor" class="primary-button" type="button">ブロックエディタで使う</button>
          </div>
          <p id="face-status" role="status"></p>
        </form>
      </section>
    </main>
    <script type="module" src="./face-editor.mjs"></script>
    <script>
      globalThis.lucide?.createIcons()
    </script>
  </body>
</html>
