<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n-document-title="flash.documentTitle">Flash firmware</title>
    <link rel="stylesheet" href="../global.css" />
    <link rel="stylesheet" href="flash.css" />
    <script type="module" src="https://unpkg.com/esp-web-tools@9/dist/web/install-button.js?module"></script>
    <script type="module">
      import { initI18n } from '../i18n.mjs'

      document.addEventListener('DOMContentLoaded', () => {
        initI18n()
      })
    </script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const button = document.querySelector('esp-web-install-button')
        const select = document.querySelector('.select-target')
        select.addEventListener('change', (event) => {
          const target = event.target.value
          button.setAttribute('manifest', `manifest_${target}.json`)
        })
      })
    </script>
  </head>

  <body>
    <div class="app">
      <div class="locale-selector">
        <label for="ui.locale" data-i18n="common.language">Language</label>
        <select id="ui.locale" data-i18n-locale-selector>
          <option value="ja">日本語</option>
          <option value="en">English</option>
          <option value="zh-Hans">简体中文</option>
        </select>
      </div>
      <select class="select-target" data-i18n-aria-label="flash.target.ariaLabel">
        <option value="esp32_m5stack">M5Stack</option>
        <option value="esp32_m5stack_core2">M5Stack Core2</option>
        <option value="esp32_m5stack_fire">M5Stack Fire</option>
        <option value="esp32_m5stack_cores3">M5Stack CoreS3</option>
      </select>
      <esp-web-install-button manifest="manifest_esp32_m5stack.json" class="button-flash-container">
        <button slot="activate" class="button-flash" data-i18n="flash.action">
          Flash Stack-chan firmware [・＿・]
        </button>
        <span slot="unsupported" data-i18n="flash.unsupported">Ah snap, your browser doesn't work!</span>
        <span slot="not-allowed" data-i18n="flash.notAllowed">Ah snap, you are not allowed to use this on HTTP!</span>
      </esp-web-install-button>
    </div>
  </body>
</html>
