<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../global.css" />
    <link rel="stylesheet" href="preference.css" />
    <script type="module">
      import { initI18n, t } from '../i18n.mjs'
      import SimpleBLEClient from './ble-client.mjs'

      document.addEventListener('DOMContentLoaded', () => {
        const i18n = initI18n()
        /**
         * Views
         */
        const settingsForm = document.getElementById('settings-form')
        const bleConnectButton = document.getElementById('ble-connect-button')
        const updateView = () => {
          if (client.isConnected()) {
            bleConnectButton.classList.remove('active')
            settingsForm.classList.add('active')
          } else {
            settingsForm.classList.remove('active')
            bleConnectButton.classList.add('active')
          }
        }

        /**
         * Event Handlers
         */
        const handleConnectButtonClick = async () => {
          console.log('Connecting')
          await client.connect()
          updateView()
        }
        const handleDisconnectButtonClick = async () => {
          console.log('Disconnecting')
          await client.disconnect()
          updateView()
        }

        const toast = document.getElementById('toast')
        toast.addEventListener('animationend', () => {
          toast.className = 'toast'
        })
        const showToast = () => {
          toast.classList.add('visible')
        }

        let submitting = null
        const handleWifiSubmit = async (event) => {
          console.log('handlewifi')
          event.preventDefault()
          if (!client.isConnected()) {
            console.warn('Not Connected')
            return
          }
          const props = [
            'wifi.ssid',
            'wifi.password',
            'driver.type',
            'driver.offsetPan',
            'driver.offsetTilt',
            'renderer.type',
            'tts.type',
            'tts.host',
            'tts.port',
            'tts.token',
            'tts.voice',
            'tts.volume',
            'ai.token',
            'ai.context',
          ]
          const payload = {}
          for (const prop of props) {
            const value = document.getElementById(prop)?.value
            if (value != null && value.trimEnd().length > 0) {
              payload[prop] = value
            }
          }
          await client.send({ _batch: payload })
          console.log('Sent')
          submitting = setTimeout(() => {
            console.error('Timeout')
          }, 3000)
        }
        const handleCharacteristicWritten = ({ prop, value }) => {
          if (submitting != null) {
            toast.innerText = t(i18n.getLocale(), 'preference.saved')
            showToast()
            clearTimeout(submitting)
            submitting = null
          }
          const elem = document.querySelector(`[name="${prop}"]`)
          if (elem != null) {
            elem.value = value
          }
        }

        /**
         * BLE Client
         */
        const client = new SimpleBLEClient({
          deviceName: 'STK',
          onCharacteristicValueChanged: handleCharacteristicWritten,
        })
        client.onDisconnected = () => {
          updateView()
        }

        /**
         * Bind
         */
        document.getElementById('ble-connect-button').addEventListener('click', handleConnectButtonClick)
        document.getElementById('ble-disconnect-button').addEventListener('click', handleDisconnectButtonClick)
        document.getElementById('form-preference').addEventListener('submit', handleWifiSubmit)
      })
    </script>
    <title data-i18n-document-title="preference.documentTitle">Stack-chan preferences</title>
  </head>

  <body>
    <div class="app">
      <div>
        <div class="locale-selector">
          <label for="ui.locale" data-i18n="common.language">Language</label>
          <select id="ui.locale" data-i18n-locale-selector>
            <option value="ja">日本語</option>
            <option value="en">English</option>
            <option value="zh-Hans">简体中文</option>
          </select>
        </div>
        <button class="accordion active" id="ble-connect-button" data-i18n="preference.connect">
          Connect Stack-chan with BLE [・＿・]
        </button>
      </div>
      <div class="accordion card" id="settings-form">
        <h2 data-i18n="preference.title">Stack-chan preferences</h2>
        <div
          class="ble-disconnect-button"
          id="ble-disconnect-button"
          title="Disconnect"
          data-i18n-title="preference.disconnect.title"
        >
          ×
        </div>
        <form class="form" id="form-preference">
          <h3 data-i18n="section.wifi">WiFi</h3>
          <div class="form-group">
            <label for="wifi.ssid"><span data-i18n="wifi.ssid">SSID</span>: </label>
            <input type="text" name="wifi.ssid" id="wifi.ssid" autocomplete="off" />
          </div>
          <div class="form-group">
            <label for="wifi.password"><span data-i18n="wifi.password">Password</span>: </label>
            <input type="password" name="wifi.password" id="wifi.password" autocomplete="off" />
          </div>
          <h3 data-i18n="section.face">Face</h3>
          <div class="form-group">
            <label for="renderer.type"><span data-i18n="common.type">Type</span>: </label>
            <select name="renderer.type" id="renderer.type">
              <option value="simple">Simple</option>
              <option value="dog">Dog</option>
            </select>
          </div>
          <h3 data-i18n="section.servo">Servo</h3>
          <div class="form-group">
            <label for="driver.type"><span data-i18n="common.type">Type</span>: </label>
            <select name="driver.type" id="driver.type">
              <option value="scservo">SCServo</option>
              <option value="dynamixel">Dynamixel(Protocol version 2)</option>
              <option value="rs30x">RS30X</option>
              <option value="pwm">PWM(SG-90)</option>
              <option value="none">None</option>
            </select>
          </div>
          <div class="form-group">
            <label for="driver.offsetPan"><span data-i18n="driver.offsetPan">Offset Pan</span>:</label>
            <input type="number" name="driver.offsetPan" id="driver.offsetPan" value="0" />
          </div>
          <div class="form-group">
            <label for="driver.offsetTilt"><span data-i18n="driver.offsetTilt">Offset Tilt</span>:</label>
            <input type="number" name="driver.offsetTilt" id="driver.offsetTilt" value="0" />
          </div>
          <h3 data-i18n="section.tts">TTS</h3>
          <div class="form-group">
            <label for="tts.type"><span data-i18n="common.type">Type</span>: </label>
            <select name="tts.type" id="tts.type">
              <option value="voicevox">VOICEVOX</option>
              <option value="elevenlabs">ElevenLabs</option>
              <option value="google-tts">Google TTS</option>
              <option value="openai">OpenAI</option>
              <option value="local">Local</option>
            </select>
          </div>
          <div class="form-group">
            <label for="tts.host"><span data-i18n="tts.host">Host</span>:</label>
            <input
              type="text"
              name="tts.host"
              id="tts.host"
              placeholder="my-tts-host.local"
              data-i18n-placeholder="tts.host.placeholder"
            />
          </div>
          <div class="form-group">
            <label for="tts.port"><span data-i18n="tts.port">Port</span>:</label>
            <input
              type="number"
              name="tts.port"
              id="tts.port"
              placeholder="50021"
              data-i18n-placeholder="tts.port.placeholder"
            />
          </div>
          <div class="form-group">
            <label for="tts.voice"><span data-i18n="tts.voice">Voice</span>:</label>
            <input
              type="text"
              name="tts.voice"
              id="tts.voice"
              placeholder="ally"
              data-i18n-placeholder="tts.voice.placeholder"
            />
          </div>
          <div class="form-group">
            <label for="tts.token"><span data-i18n="common.token">Token</span>:</label>
            <input type="text" name="tts.token" id="tts.token" />
          </div>
          <div class="form-group">
            <label for="tts.volume"><span data-i18n="tts.volume">Volume</span>:</label>
            <input type="number" name="tts.volume" id="tts.volume" step="0.1" min="0" max="1" />
          </div>
          <h3 data-i18n="section.ai">AI</h3>
          <div class="form-group">
            <label for="ai.token"><span data-i18n="common.token">Token</span>:</label>
            <input type="text" name="ai.token" id="ai.token" />
          </div>
          <label for="ai.context"><span data-i18n="ai.context">System Role</span>:</label>
          <textarea
            name="ai.context"
            id="ai.context"
            cols="30"
            rows="5"
            placeholder="You are Stack-chan(スタックチャン), the palm sized super kawaii companion robot."
            data-i18n-placeholder="ai.context.placeholder"
          ></textarea>
          <hr />
          <button type="submit" data-i18n="common.submit">Submit</button>
        </form>
      </div>
    </div>
    <div id="toast" class="toast"></div>
  </body>
</html>
